<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Prediksi & Admin</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    #loginModal { max-width: 400px; margin: 50px auto; background: #1e293b; padding: 20px; border-radius: 8px; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #eab308; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    #appContent { display: none; }
  </style>
</head>
<body>

  <!-- Modal Login -->
  <div id="loginModal">
    <h2>Admin Login</h2>
    <form onsubmit="handleAdminLogin(event)">
      <label>Username</label>
      <input type="text" id="loginUsername" required>
      <label>Password</label>
      <input type="password" id="loginPassword" required>
      <div id="loginError" style="color: #ef4444; font-size: 12px; display: none; margin-bottom: 10px;"></div>
      <button type="submit">Masuk</button>
    </form>
  </div>

  <!-- Konten Utama Dashboard -->
  <div id="appContent">
    <h1>Selamat Datang di Dashboard Prediksi!</h1>
    <p>Login berhasil. Semua fitur aktif.</p>
  </div>

  <!-- Firebase SDK & Script Login -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDduY7k1oU9ceymR1mqY3EaJTajIPjn_8Y",
      authDomain: "data-penting-keluarga.firebaseapp.com",
      projectId: "data-penting-keluarga",
      storageBucket: "data-penting-keluarga.firebasestorage.app",
      messagingSenderId: "25837458569",
      appId: "1:25837458569:web:d56fe8a67718e907e5a258",
      measurementId: "G-XK80HQRZ3X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.handleAdminLogin = async function(event) {
      event.preventDefault();
      const userInput = document.getElementById('loginUsername').value.trim();
      const passInput = document.getElementById('loginPassword').value.trim();
      const errorMsg = document.getElementById('loginError');

      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        let isValid = false;

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data.username === userInput && data.password === passInput) {
            isValid = true;
          }
        });

        if (isValid) {
          document.getElementById('loginModal').style.display = 'none';
          document.getElementById('appContent').style.display = 'block';
        } else {
          errorMsg.style.display = 'block';
          errorMsg.innerText = 'Username atau password salah!';
        }
      } catch (error) {
        console.error("Gagal terhubung ke database:", error);
        errorMsg.style.display = 'block';
        errorMsg.innerText = 'Terjadi kesalahan koneksi database.';
      }
    };
  </script>
</body>
</html>
